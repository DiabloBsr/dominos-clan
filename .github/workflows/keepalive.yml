# Garde le serveur Render ÉVEILLÉ : l'offre gratuite endort le service après
# 15 min sans trafic, et le réveil prend ~50 s (l'écran « le serveur se
# réveille »). Un ping toutes les 10 minutes suffit — et 750 h/mois d'offre
# gratuite couvrent un mois complet à 24 h/24.
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: curl -fsS --max-time 40 https://dominos-clan.onrender.com/healthz || true
